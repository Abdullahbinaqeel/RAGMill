site_name: RAGMill
site_description: >-
  A lightweight, zero-config local pipeline for AI data ingestion, semantic
  chunking, embeddings, vector search, and retrieval-augmented chat — offline
  by default, with optional cloud backends and a REST API.
site_author: Abdullah Bin Aqeel
site_url: https://abdullahbinaqeel.github.io/RAGMill/

repo_name: Abdullahbinaqeel/RAGMill
repo_url: https://github.com/Abdullahbinaqeel/RAGMill
edit_uri: edit/main/docs/

copyright: Copyright &copy; Abdullah Bin Aqeel — MIT License

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# docs/ doubles as the runtime sample-docs folder in some setups; keep stray
# sample files out of the built site.
exclude_docs: |
  welcome.txt

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - How it works: concepts.md
  - Guide:
      - CLI: guide/cli.md
      - Configuration: guide/configuration.md
      - Chat & answer generation: guide/chat.md
      - Vector stores: guide/vector-stores.md
      - REST API: guide/rest-api.md
      - Migrating backends: guide/migration.md
  - Integrate:
      - Use in your project: integration.md
      - Python API reference: api-reference.md
  - Deploy:
      - Docker: deployment.md
      - Publishing these docs: publishing-docs.md
  - Help:
      - FAQ: faq.md
      - Contributing: contributing.md
