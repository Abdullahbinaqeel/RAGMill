<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RAGMill Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0c0d0f;
    --fg: #d7f5d7;
    --dim: #6f8f6f;
    --accent: #4fd67a;
    --error: #ff6b6b;
    --border: #1f2a1f;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
    font-size: 14px;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 12px;
  }
  header {
    padding: 14px 4px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--accent);
    flex-shrink: 0;
  }
  header .path { color: var(--dim); }
  #syncRow {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding: 10px 4px;
    flex-shrink: 0;
  }
  #syncRow .prompt { margin-right: 8px; }
  #syncField {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font: inherit;
    caret-color: var(--accent);
  }
  #syncField::placeholder { color: var(--dim); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 4px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }
  .line { margin-bottom: 14px; }
  .prompt { color: var(--accent); }
  .prompt.user { color: #7ab8ff; }
  .answer { color: var(--fg); }
  .sources { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  .error { color: var(--error); }
  .pending { color: var(--dim); }
  #inputRow {
    display: flex;
    align-items: center;
    border-top: 1px solid var(--border);
    padding: 10px 4px 14px;
    flex-shrink: 0;
  }
  #inputRow .prompt { margin-right: 8px; }
  #inputField {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font: inherit;
    caret-color: var(--accent);
  }
  ::selection { background: #234023; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    ragmill-chat <span class="path">v1 &mdash; ask a question about your indexed documents</span>
  </header>
  <div id="syncRow">
    <span class="prompt">docs&gt;</span>
    <input id="syncField" type="text" autocomplete="off" placeholder="path to a documents folder, then press Enter to sync...">
  </div>
  <div id="log"></div>
  <div id="inputRow">
    <span class="prompt">you&gt;</span>
    <input id="inputField" type="text" autocomplete="off" autofocus placeholder="ask something...">
  </div>
</div>
<script>
(function () {
  const log = document.getElementById('log');
  const input = document.getElementById('inputField');
  const syncField = document.getElementById('syncField');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function appendLine(html, cls) {
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function ask(query) {
    appendLine('<span class="prompt user">you&gt;</span> ' + escapeHtml(query));
    const pending = appendLine('<span class="pending">ragmill&gt; thinking...</span>');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, top_k: 5 }),
      });

      if (!res.ok) {
        const text = await res.text();
        pending.innerHTML = '<span class="error">error&gt; ' + escapeHtml(res.status + ' ' + text) + '</span>';
        return;
      }

      const data = await res.json();
      let html = '<span class="prompt">ragmill&gt;</span> <span class="answer">' + escapeHtml(data.answer) + '</span>';
      if (data.sources && data.sources.length) {
        html += '<div class="sources">sources: ' +
          data.sources.map(s => escapeHtml(s.filename + ' (chunk ' + s.chunk_index + ', score ' + s.score.toFixed(3) + ')')).join(' &middot; ') +
          '</div>';
      }
      pending.innerHTML = html;
    } catch (err) {
      pending.innerHTML = '<span class="error">error&gt; ' + escapeHtml(String(err)) + '</span>';
    }
  }

  async function sync(directory) {
    appendLine('<span class="prompt user">docs&gt;</span> ' + escapeHtml(directory));
    const pending = appendLine('<span class="pending">ragmill&gt; syncing...</span>');

    try {
      const res = await fetch('/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ directory: directory }),
      });

      if (!res.ok) {
        const text = await res.text();
        pending.innerHTML = '<span class="error">error&gt; ' + escapeHtml(res.status + ' ' + text) + '</span>';
        return;
      }

      const data = await res.json();
      pending.innerHTML = '<span class="prompt">ragmill&gt;</span> <span class="answer">synced ' + escapeHtml(directory) +
        ': added ' + data.added + ', updated ' + data.updated +
        ', skipped ' + data.skipped + ', deleted ' + data.deleted + '</span>';
    } catch (err) {
      pending.innerHTML = '<span class="error">error&gt; ' + escapeHtml(String(err)) + '</span>';
    }
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && input.value.trim()) {
      const query = input.value.trim();
      input.value = '';
      ask(query);
    }
  });

  syncField.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && syncField.value.trim()) {
      const directory = syncField.value.trim();
      syncField.value = '';
      sync(directory);
    }
  });

  document.getElementById('app').addEventListener('click', (e) => {
    if (e.target !== syncField) input.focus();
  });
})();
</script>
</body>
</html>
