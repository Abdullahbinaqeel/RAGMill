name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please do **not** report
        security vulnerabilities here — see [SECURITY.md](https://github.com/Abdullahbinaqeel/RAGMill/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I run `ragmill sync ./docs`, ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands / code needed to reproduce.
      placeholder: |
        1. pip install ragmill[embeddings]
        2. ragmill ingest ./docs
        3. ragmill count
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RAGMill version
      description: Output of `pip show ragmill | grep Version`
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - pip install ragmill (core)
        - pip install ragmill[extra] (specify which below)
        - from source / editable install
        - Docker
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      description: Paste the full error output. This will be rendered as code.
      render: shell
