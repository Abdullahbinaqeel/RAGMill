name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: black --check src/ tests/
      - run: mypy src/ragmill/ --ignore-missing-imports --no-strict-optional

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short --cov=src/ragmill --cov-report=term-missing --cov-fail-under=75 -m "not integration"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  qdrant-integration:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Start Qdrant
        run: docker compose up -d qdrant
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/health && break
            sleep 2
          done
      - run: pytest tests/ -v --tb=short -m integration
        env:
          RAGMILL_QDRANT_URL: http://localhost:6333
      - name: Stop Qdrant
        if: always()
        run: docker compose down
