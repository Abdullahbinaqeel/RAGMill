[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragmill"
version = "0.4.1"
description = "A lightweight, zero-config local pipeline engine for AI data ingestion, semantic chunking, embeddings, and vector search — with optional cloud backends and a REST API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Bin Aqeel", email = "abdulbinaqeel@gmail.com" }
]
keywords = ["data-pipeline", "llm-ingestion", "vector-embeddings", "rag", "semantic-chunking", "onnx", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Abdullahbinaqeel/RAGMill"
Documentation = "https://abdullahbinaqeel.github.io/RAGMill/"
Repository = "https://github.com/Abdullahbinaqeel/RAGMill"
Issues = "https://github.com/Abdullahbinaqeel/RAGMill/issues"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.0"]
embeddings = [
    "onnxruntime>=1.14.0",
    "numpy>=1.22.0",
    "tokenizers>=0.15.0"
]
pinecone = [
    "pinecone>=5.0",
    "numpy>=1.22.0",
]
qdrant = [
    "qdrant-client>=1.9.0",
    "numpy>=1.22.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]
# Source-only dependency: llama-cpp-python publishes no PyPI wheels for recent
# versions, so pip builds it from a 70MB+ sdist that vendors llama.cpp. That
# needs a C++ toolchain, and on Windows the vendored tree exceeds the 260-char
# MAX_PATH limit during extraction. Kept out of `all` and `dev` for that reason
# — see TestAllExtraIsWheelInstallable in tests/test_review_fixes.py.
chat = [
    "llama-cpp-python>=0.3.0",
]
chat-gemini = [
    "google-genai>=1.0.0",
]
chat-openai = [
    "openai>=1.0.0",
]
config-ui = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "numpy>=1.22.0",
]
office = [
    "beautifulsoup4>=4.12",
    "striprtf>=0.0.26",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]
docs = [
    "mkdocs-material>=9.5",
]
all = [
    "pypdf>=4.0",
    "python-docx>=1.0",
    "onnxruntime>=1.14.0",
    "numpy>=1.22.0",
    "tokenizers>=0.15.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "pinecone>=5.0",
    "qdrant-client>=1.9.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12",
    "striprtf>=0.0.26",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    # NOTE: the `chat` extra (llama-cpp-python, the local LLM) is deliberately
    # NOT included here — it has no PyPI wheels and cannot install on a stock
    # machine. Add it separately: pip install "ragmill[chat]" (see README).
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tomli>=2.0; python_version < '3.11'",
    "black>=23.0",
    "mypy>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "reportlab>=4.0",
    "onnxruntime>=1.14.0",
    "numpy>=1.22.0",
    "tokenizers>=0.15.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    # llama-cpp-python is intentionally absent: the local-chat tests fake the
    # `llama_cpp` module via sys.modules, so the real package is never needed,
    # and requiring it would make `[dev]` uninstallable on Windows.
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "pinecone>=5.0",
    "beautifulsoup4>=4.12",
    "striprtf>=0.0.26",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[project.scripts]
ragmill = "ragmill.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmill"]

[tool.hatch.build.targets.sdist]
# Ship the package, its docs, and governance files — but not internal
# review/scratch notes that aren't part of the distributed project.
exclude = [
    "overview.md",
    "JUDGE_REVIEW.md",
    "SENIOR_DEV_REVIEW.md",
    "SQA_REVIEW.md",
    "USAGE_FLOW_REVIEW.md",
    "test_report.md",
    "automated_testing.md",
    "manual_testing.md",
    "medium_blog.md",
    "version_3.md",
    "run.sh",
    "docs/",
    "site/",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live external service (e.g. Qdrant, Pinecone)",
]
addopts = "-m 'not integration' --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*starlette.testclient.*",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true
