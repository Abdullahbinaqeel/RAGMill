[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragmill"
version = "0.2.0"
description = "A lightweight, zero-config local pipeline engine for AI data ingestion, semantic chunking, embeddings, and vector search."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Bin Aqeel", email = "abdulbinaqeel@gmail.com" }
]
keywords = ["data-pipeline", "llm-ingestion", "vector-embeddings", "rag", "semantic-chunking", "onnx", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Abdullahbinaqeel/RAGMill"
Repository = "https://github.com/Abdullahbinaqeel/RAGMill"
Issues = "https://github.com/Abdullahbinaqeel/RAGMill/issues"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.0"]
embeddings = [
    "onnxruntime>=1.14.0",
    "numpy>=1.22.0",
    "tokenizers>=0.15.0"
]
all = ["pypdf>=4.0", "python-docx>=1.0", "onnxruntime>=1.14.0", "numpy>=1.22.0", "tokenizers>=0.15.0"]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "reportlab>=4.0",
    "onnxruntime>=1.14.0",
    "numpy>=1.22.0",
    "tokenizers>=0.15.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragmill"]

[tool.hatch.build.targets.sdist]
exclude = ["overview.md"]
